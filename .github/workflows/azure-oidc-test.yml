name: Azure OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    azure-auth-test:
        runs-on: ubuntu-latest

        steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Authenticate to Azure using OIDC
           uses: azure/login@v3
           with:
              client-id: ${{ secrets.AZURE_CLIENT_ID    }} 
              tenant-id: ${{ secrets.AZURE_TENANT_ID    }} 
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  

         - name: Verify Azure resource group access
           run: az group show --name rg-azure-secure-infra-dev --query "{name:name,location:location}" -o json  

         - name: Verify Terraform state blob access
           run: az storage blob show --account-name sttfstatejosiah26 --container-name tfstate --name secure-infra-dev.tfstate --auth-mode login --query name -o tsv  
