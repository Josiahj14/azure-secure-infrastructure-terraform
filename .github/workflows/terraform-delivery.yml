name: Terraform Delivery

on:
   workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
  terraform-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
             terraform_version: "1.17.1"

      - name: Authenticate to Azure using OIDC
        uses: azure/login@v3
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID    }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID    }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform backend
        run: terraform init -input=false  -no-color

      - name: Generate Terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Verify saved Terraform plan
        run: |
          pwd
          ls -lh tfplan
          test -s tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/tfplan
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development

    permissions:
      contents: read
      id-token: write

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

    steps:
      - name: Authenticate to Azure using environment OIDC
        uses: azure/login@v3
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID    }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID    }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform backend
        run: terraform init -input=false -no-color

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}

      - name: Verify downloaded Terraform plan
        run: |
          pwd
          ls -lh ./tfplan
          test -s ./tfplan

      - name: Apply approved Terraform plan
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan